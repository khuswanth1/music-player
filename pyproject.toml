[project]
name = "wavely-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.112",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "sqlalchemy>=2.0",
    "stripe>=16.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.4",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP046", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001", "UP"]
"tests/test_music_providers.py" = ["E501"]  # recorded provider payloads read best unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=60"
