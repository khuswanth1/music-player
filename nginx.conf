# Serves the SPA and proxies /api (REST, streaming and WebSocket) to the backend,
# so the browser sees one origin and the httpOnly refresh cookie just works.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 60m;  # audio uploads (backend limit is 50 MB)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/v1/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # server pings every 25 s
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;  # stream audio ranges straight through
        proxy_request_buffering off;
    }

    location ~ ^/(docs|redoc|openapi.json|health) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes fall back to index.html; never cache it so deploys take effect.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
